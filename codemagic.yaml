workflows:
  android-workflow:
    name: DevFest Android Build

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      flutter: stable
      groups:
        - firebase_credentials

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Run Flutter tests
        script: |
          flutter test

      - name: Analyze Flutter code
        script: |
          flutter analyze

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT

        android:
          app_id: 1:346528691909:android:a6bcaa14d0cab3f317a2ac

          groups:
            - devfest-testers

          artifact_type: apk
