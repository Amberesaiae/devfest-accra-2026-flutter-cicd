workflows:
  android-workflow:
    name: DevFest Android Build

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Run Flutter tests
        script: |
          flutter test

      - name: Analyze Flutter code
        script: |
          flutter analyze

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
